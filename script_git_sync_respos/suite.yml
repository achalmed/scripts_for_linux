# script_git_sync_respos/suite.yml — suite git_sync_respos: Sincroniza (pull, add, commit, push) y reporta el estado de los repos del workspace listados en repos-config.yml, el registro que comparte con Git Studio.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: git_sync_respos
objetivo: sistema
resumen: Sincroniza (pull, add, commit, push) y reporta el estado de los repos del workspace listados en repos-config.yml, el registro que comparte con Git Studio.
escribe_en:
- git
simula_por_defecto: false
comandos:
- sync.sh --check
- sync.sh -m "mensaje" -r "repo1,repo2"
- status.sh --days 30
- sync.sh --help
estado: activo
entrada: repos-config.yml (base_directory y lista de repos habilitados)
depende_de:
- bash >= 4
- git
pruebas: tests/run.sh -k git_sync_respos   # desde la raíz del repo; simulación sobre un HOME temporal (tests/test_simulacion.py)
nota: Backend de Git Studio (páginas Sincronizar, Repositorios y Reportes); sigue siendo utilizable desde la terminal. Sin main.sh a propósito, dos entradas (sync.sh y status.sh) y config en lib/config.sh; repos-config.yml es el registro de repos que comparte con la GUI.

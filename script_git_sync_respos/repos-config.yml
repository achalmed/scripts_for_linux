# =============================================================================
# repos-config.yml — Configuración de git-sync
# =============================================================================
# Compartido entre Git Studio (GUI) y los scripts CLI sync.sh / status.sh.
# Editable a mano o desde la página «Repositorios» de la aplicación.
#
# FORMATO REQUERIDO (el parser es ligero, no es YAML genérico):
#   - 'name' con exactamente 2 espacios + "- " antes
#   - 'branch' y 'enabled' con exactamente 4 espacios antes
#   - No uses comillas, anchors, listas inline ni anidación adicional
# =============================================================================

# Directorio base donde están todos los repositorios (una carpeta por repo)
base_directory: ~/Documents
# Los pub_* son submódulos del hub (website-achalma/_pubs/*) desde 2026-09-06;
# el nombre es la ruta relativa a base_directory.

# Lista de repositorios a gestionar
repositories:

  - name: 04 index/_pubs/actus-mercator
    branch: main
    enabled: true

  - name: 04 index/_pubs/aequilibria
    branch: main
    enabled: true

  - name: 04 index/_pubs/axiomata
    branch: main
    enabled: true

  - name: 04 index/_pubs/chaska
    branch: main
    enabled: true

  - name: 04 index/_pubs/dialectica-y-mercado
    branch: main
    enabled: true

  - name: 04 index/_pubs/epsilon-y-beta
    branch: main
    enabled: true

  - name: 04 index/_pubs/methodica
    branch: main
    enabled: true

  - name: 04 index/_pubs/numerus-scriptum
    branch: main
    enabled: true

  - name: 04 index/_pubs/optimums
    branch: main
    enabled: true

  - name: 04 index/_pubs/pecunia-fluxus
    branch: main
    enabled: true

  - name: 04 index/_pubs/res-publica
    branch: main
    enabled: true

  - name: 04 index
    branch: main
    enabled: true

  - name: scripts_for_zotero
    branch: main
    enabled: true

  - name: scripts_document_studio
    branch: main
    enabled: true

  - name: scripts-linux
    branch: main
    enabled: true

  - name: scripts-latex
    branch: main
    enabled: true

  - name: scripts-biblioteca
    branch: main
    enabled: true


  - name: prompts
    branch: main
    enabled: true

  - name: docencia/contenido            # M6 (2026-09-15): submódulo único de contenido (repo Academic_Class); sustituye a las 23 áreas
    branch: main
    enabled: true
  - name: docencia
    branch: main
    enabled: true


  - name: scripts-quarto
    branch: main
    enabled: true

  - name: escritura
    branch: main
    enabled: true

# Mensaje de commit por defecto cuando no se pasa -m
default_commit_message: "update: sincronización automática de contenidos"

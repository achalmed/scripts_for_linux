# scripts_filesystem_studio/backend/script_hardlinks-detector/suite.yml — suite hardlinks_detector: Detecta los hard links de un árbol y los presenta agrupados por inodo como árbol, CSV, JSON o reporte de auditoría.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: hardlinks_detector
objetivo: sistema
resumen: Detecta los hard links de un árbol y los presenta agrupados por inodo como árbol, CSV, JSON o reporte de auditoría.
escribe_en:
- ninguno
simula_por_defecto: false
comandos:
- main.sh [directorio]
- main.sh <directorio> -f json -o salida.json
- main.sh <directorio> --report
- main.sh --help
estado: activo
entrada: cualquier carpeta (por defecto la actual)
depende_de:
- bash >= 4
- GNU findutils
nota: Backend de Filesystem Studio (pestañas Detectar y Reportes de Hardlinks) desde 2026-07-13; sigue siendo utilizable desde la terminal. Solo lee; -o y --report escriben el archivo que se les pide.

# =============================================================================
# repos-config.yml — Configuración de git-sync
# =============================================================================
# Compartido entre Git Studio (GUI) y los scripts CLI sync.sh / status.sh.
# Editable a mano o desde la página «Repositorios» de la aplicación.
#
# FORMATO REQUERIDO (el parser es ligero, no es YAML genérico):
#   - 'name' con exactamente 2 espacios + "- " antes
#   - 'branch' y 'enabled' con exactamente 4 espacios antes
#   - No uses comillas, anchors, listas inline ni anidación adicional
# =============================================================================

# Directorio base donde están todos los repositorios (una carpeta por repo)
base_directory: ~/Documents
# Los pub_* son submódulos del hub (website-achalma/_pubs/pub_*) desde 2026-09-06;
# el nombre es la ruta relativa a base_directory.

# Lista de repositorios a gestionar
repositories:

  - name: 04 index/_pubs/pub_actus-mercator
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_aequilibria
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_axiomata
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_chaska
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_dialectica-y-mercado
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_epsilon-y-beta
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_methodica
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_numerus-scriptum
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_optimums
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_pecunia-fluxus
    branch: main
    enabled: true

  - name: 04 index/_pubs/pub_res-publica
    branch: main
    enabled: true

  - name: 04 index
    branch: main
    enabled: true

  - name: scripts_for_zotero
    branch: main
    enabled: true

  - name: scripts_document_studio
    branch: main
    enabled: true

  - name: scripts_for_linux
    branch: main

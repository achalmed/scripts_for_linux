# script_registro_tiempo/suite.yml — suite registro_tiempo: Reúne el tiempo de KOReader, Zotero, ActivityWatch y Super Productivity en el vault, y crea en Super Productivity la rutina diaria, los cursos con su currículo y fechas, las tareas de lectura de las notas y las del despacho asignadas al autor en Minka.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
esquema_version: 2
id: registro_tiempo
objetivo: personal
resumen: Reúne el tiempo de KOReader, Zotero, ActivityWatch y Super Productivity en el vault, y crea en Super Productivity la rutina diaria, los cursos con su currículo y fechas, las tareas de lectura de las notas y las del despacho asignadas al autor en Minka.
escribe_en:
- vault
- archivos
- sistema
simula_por_defecto: true
comandos:
- main.py recoger --aplicar
- main.py rutina --aplicar
- main.py cursos --aplicar
- main.py notas --aplicar
- main.py minka --aplicar
- main.py plugin --aplicar
estado: borrador
creado: 2026-10-25
entrada: tareas/registro-tiempo.yml (categorías, metas y estructura propuesta)
lee_de:
- tareas
- koreader-respaldo
- zotero
- despacho
depende_de:
- python3 (con PyYAML)
- core/env.py
- core/py-common/logger.py
- Super Productivity 18 con la API REST local activada (opcional)
- ActivityWatch o awatcher (opcional)
- Minka con «mis tareas» (GET /api/tareas/mias.json) y su dirección en $DESPACHO_DIR/operaciones/minka/.env (opcional)
timer: registro-tiempo.timer
pruebas: tests/run.sh -k "registro_tiempo or minka"   # desde la raíz del repo; fuentes sintéticas y el plugin con node
nota: El plugin de plugin-sp/ se sube a mano en Super Productivity (Ajustes → Plugins); la suite solo lo empaqueta. `main.py minka --aplicar` trae las tareas de Minka (también lo corre el timer). `planificar` y `timer` están en el README.

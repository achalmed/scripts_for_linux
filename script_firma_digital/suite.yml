# script_firma_digital/suite.yml — suite firma_digital: Convierte la foto de una firma en SVG y PNG limpios (canal rojo, histéresis, potrace).
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: firma_digital
objetivo: personal
resumen: Convierte la foto de una firma en SVG y PNG limpios (canal rojo, histéresis, potrace).
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.py firma.jpg [-o <carpeta>] [-n <nombre>]
- main.py firma.jpg --dry-run
estado: activo
depende_de:
- python3 (numpy, scipy, scikit-image, Pillow)
- potracer (paquete de Python; no el binario potrace)
pruebas: tests/run.sh -k firma_digital   # desde la raíz del repo; solo --help: datos personales (tests/test_simulacion.py)

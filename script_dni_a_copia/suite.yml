# script_dni_a_copia/suite.yml — suite dni_a_copia: Convierte dos fotografías de un DNI (anverso y reverso) en una copia limpia a tamaño real lista para imprimir.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: dni_a_copia
objetivo: personal
resumen: Convierte dos fotografías de un DNI (anverso y reverso) en una copia limpia a tamaño real lista para imprimir.
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.py --front anverso.jpg --back reverso.jpg [-o <carpeta>] [--to-pdf]
- main.py --front anverso.jpg --back reverso.jpg --dry-run
estado: activo
depende_de:
- python3 (numpy, scipy, Pillow, python-docx; scikit-image recomendada)
- LibreOffice (solo --to-pdf)
pruebas: tests/run.sh -k dni_a_copia   # desde la raíz del repo; solo --help: datos personales (tests/test_simulacion.py)

# script_sync_usb/suite.yml — suite sync_usb: sincroniza en ambas direcciones una carpeta local con su copia en un USB compartido, con papelera y detección de conflictos.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: sync_usb
objetivo: sistema
resumen: Sincroniza en ambas direcciones una carpeta local con su copia en un USB compartido (dos equipos, un USB que va y viene), con papelera y detección de conflictos; solo biblioteca estándar de Python.
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.py --local <carpeta> --usb <montaje> [--dry-run]
- sincronizar_usb.sh --local <carpeta> --usb <montaje> [--dry-run]
estado: activo
depende_de:
- python3
pruebas: tests/run.sh -k sync_usb   # desde la raíz del repo; simulación sobre un HOME temporal (tests/test_simulacion.py)
nota: 'Fija la carpeta SGDP en el USB y aplica la convención de nombres del SGDP: los PDF gemelos de nombre antiguo pasan a la papelera (.sgdp-papelera).'

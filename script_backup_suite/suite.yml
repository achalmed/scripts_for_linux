# script_backup_suite/suite.yml — suite backup_suite: Sincroniza carpetas del home hacia un disco externo por perfiles, con confirmación, exclusiones y resumen.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: backup_suite
objetivo: sistema
resumen: Sincroniza carpetas del home hacia un disco externo por perfiles, con confirmación, exclusiones y resumen.
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.sh --profile completo
- main.sh --dry-run
- main.sh --help
estado: activo
depende_de:
- rsync
